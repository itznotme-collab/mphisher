<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicia sesión - Google</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #17181c;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans">
  
  <div class="w-full max-w-6xl px-6">
    
    <!-- Card -->
    <div class="bg-[#202124] rounded-3xl shadow-2xl p-8 md:p-12 relative">
      
      <!-- Logo G pequeño en esquina superior izquierda -->
      <div class="absolute top-6 left-8">
        <img 
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1280px-Google_%22G%22_logo.svg.png" 
          alt="Google" 
          class="w-16 h-16">
      </div>
      
      <div class="flex items-start gap-16 pt-8">
        
        <!-- Columna izquierda: Título (movido 1/5 a la izquierda) -->
        <div class="w-2/5 -ml-3 pt-8">   <!-- Movido ligeramente a la izquierda -->
          <h1 class="text-5xl font-medium text-white">Inicia sesión</h1>
          <p class="text-gray-400 mt-2 text-xl">Utiliza tu cuenta de Google</p>
        </div>

        <!-- Columna derecha: Formulario -->
        <div class="flex-1 max-w-md">
          <div class="space-y-4">
            
            <!-- Input Correo -->
            <div>
              <input 
                type="text" 
                class="w-full bg-transparent border border-gray-400 focus:border-blue-500 rounded-2xl px-6 py-4 text-white outline-none text-lg"
                placeholder="Correo electrónico o teléfono">
            </div>

            <!-- Input Contraseña -->
            <div>
              <input 
                type="password" 
                class="w-full bg-transparent border border-gray-400 focus:border-blue-500 rounded-2xl px-6 py-4 text-white outline-none text-lg"
                placeholder="Introduce tu contraseña">
            </div>

            <a href="#" class="text-blue-400 hover:underline text-sm block">
              ¿Has olvidado tu correo electrónico?
            </a>

            <!-- Modo Invitado -->
            <p class="text-sm text-gray-400 leading-relaxed">
              ¿No es tu ordenador? Usa el modo Invitado para iniciar sesión de forma privada. 
              <a href="#" class="text-blue-400 hover:underline">Más información sobre cómo usar el modo Invitado</a>
            </p>

            <!-- Botones -->
            <div class="flex justify-between items-center pt-4">
              <a href="#" class="text-blue-400 hover:underline font-medium">Crear cuenta</a>
              <button class="bg-blue-500 hover:bg-blue-600 px-10 py-3 rounded-full text-white font-medium transition-colors">
                Siguiente
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 flex justify-between text-sm text-gray-400 px-4">
      <div class="flex items-center gap-1 cursor-pointer">
        Español (España) <span class="text-xs">▼</span>
      </div>
      <div class="flex gap-6">
        <a href="#" class="hover:text-gray-200">Ayuda</a>
        <a href="#" class="hover:text-gray-200">Privacidad</a>
        <a href="#" class="hover:text-gray-200">Términos</a>
      </div>
    </div>
  </div>

</body>
</html>
